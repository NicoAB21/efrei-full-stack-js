# Environnement de développement : docker compose up --build
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/occaz
      JWT_SECRET: change-me-dev-only
      UPLOADS_DIR: /app/uploads
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # Relais des webhooks Stripe (paiement de démonstration, spec 005) : remplace `stripe listen` dans un terminal.
  # Lit STRIPE_SECRET_KEY dans backend/.env ; sans clé, il s'arrête aussitôt et le reste du site fonctionne.
  stripe:
    image: stripe/stripe-cli:v1.55.3
    env_file:
      - path: ./backend/.env
        required: false
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -z "$$STRIPE_SECRET_KEY" ]; then echo "Pas de STRIPE_SECRET_KEY : relais Stripe désactivé"; exit 0; fi
        export STRIPE_API_KEY="$$STRIPE_SECRET_KEY"
        exec stripe listen --events checkout.session.completed,checkout.session.expired --forward-to backend:3000/api/stripe/webhook
    restart: on-failure
    depends_on:
      - backend

volumes:
  mongo-data:
