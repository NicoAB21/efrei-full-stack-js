openapi: 3.0.3
info:
  title: Occaz API
  version: 1.0.0
  description: >
    API de petites annonces (Contrat API v1 du livret appliqué à la ressource `listings`).
    Ce document décrit les routes réellement implémentées (MVP US1–US3, vitrine publique US4, messagerie US5).
    Prix en centimes. Toute erreur : {"error":{"code","message"}}.
servers:
  - url: http://localhost:3000
tags:
  - name: health
  - name: auth
  - name: listings
  - name: public
    description: Vitrine publique (US4), sans authentification
  - name: communes
    description: Référentiel officiel des communes (spec 004), public
  - name: favorites
    description: Favoris liés au compte (bonus, spec 002)
  - name: purchases
    description: Paiement de DÉMONSTRATION (Stripe en mode test, spec 005) ; routes absentes si aucune clé de test n'est configurée
  - name: messages
    description: Messagerie privée acheteur ↔ vendeur, une conversation par annonce (US5)

paths:
  /api/health:
    get:
      tags: [health]
      summary: État du serveur
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /api/auth/register:
    post:
      tags: [auth]
      summary: Créer un compte
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201': { $ref: '#/components/responses/AuthOk' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '409':
          description: Email déjà utilisé (comparaison insensible à la casse)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/login:
    post:
      tags: [auth]
      summary: Se connecter
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200': { $ref: '#/components/responses/AuthOk' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401':
          description: Email ou mot de passe incorrect (message neutre)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/listings:
    get:
      tags: [listings]
      summary: Lister MES annonces (plus récentes d'abord)
      responses:
        '200':
          description: Annonces du compte connecté uniquement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [listings]
      summary: Publier une annonce
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingCreate' }
      responses:
        '201':
          description: Créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/listings/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [listings]
      summary: Détail d'une de MES annonces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [listings]
      summary: Modifier partiellement une de MES annonces
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingUpdate' }
      responses:
        '200':
          description: Annonce mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [listings]
      summary: Supprimer une de MES annonces
      responses:
        '204': { description: Supprimée, aucun corps }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/public/listings:
    get:
      tags: [public]
      summary: Annonces disponibles de tous les vendeurs (50 max, plus récentes d'abord)
      description: >
        Les annonces vendues ne sont jamais renvoyées. 400 si un paramètre est inconnu ou invalide,
        ou si minPrice est supérieur à maxPrice. `city` est comparée sans tenir compte de la casse.
      security: []
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: city, in: query, description: Nom de commune (casse, accents et tirets ignorés ; toutes ses annonces), schema: { type: string, maxLength: 80 } }
        - { name: cityCode, in: query, description: Code officiel de la commune, schema: { type: string, pattern: '^[0-9][0-9AB][0-9]{3}$' } }
        - { name: q, in: query, description: Mot-clé (titre ou description), schema: { type: string, maxLength: 100 } }
        - { name: minPrice, in: query, description: En centimes, schema: { type: integer, minimum: 1 } }
        - { name: maxPrice, in: query, description: En centimes, schema: { type: integer, minimum: 1 } }
        - { name: ownerId, in: query, description: Annonces d'un même vendeur (page produit), schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
        - { name: sort, in: query, description: Tri (défaut recent), schema: { type: string, enum: [recent, price_asc, price_desc] } }
        - { name: buyable, in: query, description: '1 = achat en ligne possible (hors Immobilier / Véhicules, ≤ 10 000 €)', schema: { type: string, enum: ['1'] } }
        - { name: photos, in: query, description: '1 = avec au moins une photo', schema: { type: string, enum: ['1'] } }
        - { name: page, in: query, description: Page de 50 résultats (défaut 1), schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        '200':
          description: OK (uniquement status = available) ; `total` = nombre d'annonces correspondantes, toutes pages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListingList'
                  - type: object
                    required: [total]
                    properties:
                      total: { type: integer }
        '400': { $ref: '#/components/responses/InvalidInput' }

  /api/public/listings/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [public]
      summary: Détail d'une annonce disponible
      description: 404 si l'annonce n'existe pas ou est vendue. Aucune donnée personnelle du vendeur.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Listing'
                  - type: object
                    required: [buyable]
                    properties:
                      buyable:
                        type: boolean
                        description: Achat en ligne de démonstration proposé (paiement activé, hors Immobilier / Véhicules, ≤ 10 000 €)
        '400': { $ref: '#/components/responses/InvalidInput' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/public/listings/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [messages]
      summary: Écrire au vendeur depuis une annonce disponible (ouvre ou reprend la conversation)
      description: >
        Une conversation par couple acheteur–annonce ; le vendeur est calculé par le serveur, l'expéditeur vient du JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '201':
          description: Envoyé
          content:
            application/json:
              schema:
                type: object
                required: [conversationId, message]
                properties:
                  conversationId: { type: string }
                  message: { $ref: '#/components/schemas/ChatMessage' }
        '400':
          description: Corps invalide, id mal formé, ou message sur sa propre annonce
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }   # inexistante ou vendue

  /api/conversations:
    get:
      tags: [messages]
      summary: Mes conversations (acheteur ou vendeur), la plus récente en tête
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/conversations/unread:
    get:
      tags: [messages]
      summary: Nombre total de messages non lus (pastille)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [messages]
      summary: Une conversation et tous ses messages (participants seulement)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Conversation'
                  - type: object
                    required: [messages, otherReadAt]
                    properties:
                      otherReadAt: { type: string, format: date-time, nullable: true, description: Dernière lecture de l'interlocuteur (mention « Vu ») }
                      messages:
                        type: array
                        items: { $ref: '#/components/schemas/ChatMessage' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }   # inexistante ou conversation d'autres personnes

  /api/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [messages]
      summary: Répondre dans une conversation (même si l'annonce est vendue ou supprimée)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '201':
          description: Envoyé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/conversations/{id}/read:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [messages]
      summary: Marquer la conversation comme lue (remet ses non-lus à zéro)
      responses:
        '204': { description: Lue }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/favorites:
    get:
      tags: [favorites]
      summary: Mes favoris, du plus récemment ajouté au plus ancien
      description: >
        Annonces existantes uniquement (une annonce supprimée disparaît), y compris vendues
        (status = sold, à afficher « plus disponible »). Aucune donnée privée du vendeur.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items: { $ref: '#/components/schemas/FavoriteListing' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/favorites/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'   # id de l'ANNONCE
    put:
      tags: [favorites]
      summary: Ajouter une annonce à mes favoris (idempotent)
      responses:
        '204': { description: Dans mes favoris (ajoutée ou déjà présente) }
        '400':
          description: Id mal formé, sa propre annonce, ou limite de 200 favoris atteinte
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }   # inexistante ou vendue
    delete:
      tags: [favorites]
      summary: Retirer une annonce de mes favoris
      responses:
        '204': { description: Retirée }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }   # pas dans MES favoris

  /api/favorites/import:
    post:
      tags: [favorites]
      summary: Importer les favoris du navigateur à la connexion
      description: Ignore les ids inexistants, vendus, déjà présents ou appartenant à l'utilisateur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [listingIds]
              properties:
                listingIds:
                  type: array
                  maxItems: 200
                  items: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '200':
          description: Ids réellement importés
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/listings/{id}/photos:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [listings]
      summary: Ajouter 1 à 5 photos à MON annonce (5 au total maximum)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: binary }
                  description: JPEG, PNG ou WebP (vérifié sur le contenu), 5 Mo maximum chacune
      responses:
        '201':
          description: Annonce avec ses photos
          content: { application/json: { schema: { $ref: '#/components/schemas/Listing' } } }
        '400':
          description: Format refusé (SVG, GIF, PDF, faux JPEG…), plus de 5 Mo, plus de 5 photos, aucune photo
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [listings]
      summary: Réordonner les photos de MON annonce (la première devient principale)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [order]
              properties:
                order:
                  type: array
                  maxItems: 5
                  items: { type: string, format: uuid }
                  description: Permutation exacte des ids de photos existants
      responses:
        '200':
          description: Annonce avec ses photos réordonnées
          content: { application/json: { schema: { $ref: '#/components/schemas/Listing' } } }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/listings/{id}/photos/{photoId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: photoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [listings]
      summary: Supprimer une photo de MON annonce
      responses:
        '200':
          description: Annonce sans cette photo (la suivante devient principale si besoin)
          content: { application/json: { schema: { $ref: '#/components/schemas/Listing' } } }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/communes:
    get:
      tags: [communes]
      summary: Suggestions de communes officielles (par début de nom ou code postal)
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: 2 à 60 caractères ; casse, accents et tirets ignorés ; chiffres = code postal
          schema: { type: string, minLength: 2, maxLength: 60 }
      responses:
        '200':
          description: 20 suggestions maximum, une par couple commune / code postal
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/CommuneSuggestion' }
        '400': { $ref: '#/components/responses/InvalidInput' }

  /api/purchases:
    post:
      tags: [purchases]
      summary: Lancer l'achat (DÉMONSTRATION, mode test Stripe) d'une annonce disponible
      description: Le prix est lu en base, jamais fourni par le client. Double clic → même page de paiement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [listingId]
              properties:
                listingId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      responses:
        '201':
          description: URL de la page de paiement Stripe (ou celle d'un achat en attente déjà ouvert)
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '400':
          description: Sa propre annonce, catégorie Immobilier/Véhicules ou prix > 10 000 €
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Stripe injoignable (PAYMENT_UNAVAILABLE), aucun achat créé
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    get:
      tags: [purchases]
      summary: Mes achats, du plus récent au plus ancien
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Purchase' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/stripe/webhook:
    post:
      tags: [purchases]
      summary: Confirmation Stripe (signature `Stripe-Signature` obligatoire, corps brut)
      security: []
      description: >
        Appelé par Stripe uniquement. Traite checkout.session.completed (vente si l'annonce est encore
        disponible, sinon remboursement automatique) et checkout.session.expired.
        Signature invalide → 400 sans effet. Événement déjà traité → 200 sans effet.
      responses:
        '200': { description: Événement reçu }
        '400': { $ref: '#/components/responses/InvalidInput' }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: ObjectId (24 caractères hexadécimaux), sinon 400
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }

  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string }

    Category:
      type: string
      enum: [vehicules, immobilier, multimedia, maison, mode, loisirs, autre]

    Status:
      type: string
      enum: [available, sold]

    ListingCreate:
      type: object
      additionalProperties: false
      required: [title, priceCents, category, cityCode, postalCode]
      properties:
        title: { type: string, minLength: 1, maxLength: 120, description: Espaces retirés avant contrôle }
        description: { type: string, maxLength: 2000, default: '' }
        priceCents: { type: integer, minimum: 1, maximum: 9007199254740991 }
        category: { $ref: '#/components/schemas/Category' }
        cityCode: { type: string, pattern: '^[0-9][0-9AB][0-9]{3}$', description: Code officiel (INSEE) de la commune, ex. 69123 pour Lyon }
        postalCode: { type: string, pattern: '^[0-9]{5}$', description: 'Code postal, doit appartenir à la commune' }
        status: { $ref: '#/components/schemas/Status' }

    ListingUpdate:
      description: Mêmes champs que ListingCreate, tous facultatifs, au moins un requis ; cityCode et postalCode vont ensemble
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        priceCents: { type: integer, minimum: 1, maximum: 9007199254740991 }
        category: { $ref: '#/components/schemas/Category' }
        cityCode: { type: string, pattern: '^[0-9][0-9AB][0-9]{3}$', description: Code officiel (INSEE) de la commune, ex. 69123 pour Lyon }
        postalCode: { type: string, pattern: '^[0-9]{5}$', description: 'Code postal, doit appartenir à la commune' }
        status: { $ref: '#/components/schemas/Status' }

    Listing:
      type: object
      required: [id, ownerId, title, description, priceCents, category, city, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        ownerId: { type: string }
        title: { type: string }
        description: { type: string }
        priceCents: { type: integer }
        category: { $ref: '#/components/schemas/Category' }
        city: { type: string, description: Nom officiel de la commune (texte d'origine pour une ancienne annonce non rattachée) }
        cityCode: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/Status' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        photos:
          type: array
          maxItems: 5
          description: 0 à 5 photos, la première est la photo principale (spec 003)
          items: { $ref: '#/components/schemas/Photo' }
        soldOnline:
          description: Vente en ligne de démonstration (spec 005) ; réponses privées du propriétaire seulement
          type: object
          required: [at, priceCents]
          properties:
            at: { type: string, format: date-time }
            priceCents: { type: integer }

    ListingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Listing' }

    FavoriteListing:
      allOf:
        - $ref: '#/components/schemas/Listing'
        - type: object
          required: [favoritedAt]
          properties:
            favoritedAt: { type: string, format: date-time }

    Photo:
      type: object
      required: [id, url, cardUrl, width, height]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, example: /uploads/6f1c2e3a-…-1600.webp }
        cardUrl: { type: string, example: /uploads/6f1c2e3a-…-480.webp }
        width: { type: integer }
        height: { type: integer }

    CommuneSuggestion:
      type: object
      required: [cityCode, name, postalCode, department, label]
      properties:
        cityCode: { type: string, example: '69123' }
        name: { type: string, example: Lyon }
        postalCode: { type: string, example: '69003' }
        department: { type: string, example: '69' }
        label: { type: string, example: Lyon (69003) }

    Purchase:
      type: object
      required: [id, listingId, listingTitle, priceCents, status, createdAt, confirmedAt]
      properties:
        id: { type: string }
        listingId: { type: string }
        listingTitle: { type: string, description: Titre au moment de l'achat }
        listingPhotoUrl: { type: string, nullable: true, description: Vignette de la photo principale au moment de l'achat }
        priceCents: { type: integer, description: Prix figé au clic sur « Acheter » }
        status: { type: string, enum: [pending, confirmed, refunded, expired] }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time, nullable: true }

    MessageCreate:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000, description: Espaces de début et de fin retirés }

    ChatMessage:
      type: object
      required: [id, body, createdAt, mine]
      properties:
        id: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        mine: { type: boolean, description: Écrit par le compte connecté }

    Conversation:
      type: object
      required: [id, role, other, listing, lastMessage, unread]
      properties:
        id: { type: string }
        role: { type: string, enum: [buyer, seller], description: Rôle du compte connecté }
        other:
          type: object
          required: [label, role]
          properties:
            label: { type: string, description: « Membre XXXX », jamais l'email }
            role: { type: string, enum: [buyer, seller] }
        listing:
          type: object
          required: [id, title, photoUrl, priceCents, status]
          description: Annonce d'origine, titre, photo et prix figés au premier message
          properties:
            id: { type: string }
            title: { type: string }
            photoUrl: { type: string, nullable: true }
            priceCents: { type: integer }
            status: { type: string, enum: [available, sold, deleted] }
        lastMessage:
          type: object
          nullable: true
          properties:
            body: { type: string }
            at: { type: string, format: date-time }
            mine: { type: boolean }
        unread: { type: integer, description: Messages non lus par le compte connecté }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_INPUT, UNAUTHORIZED, NOT_FOUND, EMAIL_ALREADY_USED, INTERNAL_ERROR]
              description: INTERNAL_ERROR uniquement pour une erreur serveur imprévue (500), sans détail technique
            message: { type: string }

  responses:
    AuthOk:
      description: Compte authentifié
      content:
        application/json:
          schema:
            type: object
            required: [user, token]
            properties:
              user: { $ref: '#/components/schemas/User' }
              token: { type: string }
    InvalidInput:
      description: Entrée invalide (corps, paramètre ou id mal formé)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: JWT absent, invalide ou expiré
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Inexistant ou appartenant à un autre compte
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
